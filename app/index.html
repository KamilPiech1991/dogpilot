<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="/brand/icon-512.png" />
    <meta property="og:title" content="Dogpilot – hodowla i opieka nad psem" />
    <meta property="og:image" content="/brand/header-1600.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#32BF46" />
    <meta name="description" content="Dogpilot – aplikacja dla hodowców i właścicieli psów: psy, zdrowie, rozród, mioty, wystawy, finanse, raporty." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
    <title>Dogpilot – hodowla i opieka nad psem</title>
    <style>
      /* Intro po uruchomieniu aplikacji: logo pojawia się powoli, pasek ładowania z łapek. */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(120% 80% at 50% 30%, #FFFFFF 0%, #EAF8EC 55%, #D3F1D9 100%); font-family: 'Nunito', system-ui, sans-serif; transition: opacity .45s ease, visibility .45s; }
      #splash.dark { background: radial-gradient(120% 80% at 50% 30%, #1B2B22 0%, #0F1A15 70%); }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash .sp-badge { width: 96px; height: 96px; border-radius: 30px; background: linear-gradient(135deg, #32BF46, #1F5B43); display: grid; place-items: center; box-shadow: 0 18px 40px rgba(31, 91, 67, .28); opacity: 0; transform: scale(.6) rotate(-12deg); animation: spBadge .9s cubic-bezier(.2,.9,.3,1.2) .15s forwards, spPulse 2.2s ease-in-out 1.1s infinite; }
      #splash .sp-badge svg { width: 54px; height: 54px; fill: #fff; }
      #splash .sp-word { width: min(62vw, 260px); height: auto; opacity: 0; filter: blur(8px); transform: translateY(10px) scale(.96); animation: spWord 1.5s ease .55s forwards; }
      #splash .sp-tag { margin-top: -6px; font-size: 14px; font-weight: 700; color: #4C6B58; opacity: 0; animation: spFade .8s ease 1.4s forwards; }
      #splash.dark .sp-tag { color: #A7C7B2; }
      #splash .sp-trail { display: flex; align-items: center; gap: 10px; margin-top: 26px; height: 46px; opacity: 0; animation: spFade .5s ease .9s forwards; }
      #splash .sp-paw { width: 26px; height: 26px; fill: #CFE9D5; transform: rotate(90deg); transition: fill .25s; }
      #splash.dark .sp-paw { fill: #27503C; }
      #splash .sp-paw:nth-child(odd) { margin-top: -18px; } #splash .sp-paw:nth-child(even) { margin-top: 18px; }
      #splash .sp-paw.on { fill: #32BF46; animation: spStep .35s ease; }
      #splash .sp-pct { font-size: 12px; font-weight: 800; letter-spacing: .5px; color: #1F8A30; min-width: 120px; text-align: center; opacity: 0; animation: spFade .5s ease 1s forwards; }
      #splash.dark .sp-pct { color: #6FD883; }
      @keyframes spBadge { to { opacity: 1; transform: none; } }
      @keyframes spPulse { 50% { transform: scale(1.05); box-shadow: 0 22px 50px rgba(50, 191, 70, .35); } }
      @keyframes spWord { to { opacity: 1; filter: none; transform: none; } }
      @keyframes spFade { to { opacity: 1; } }
      @keyframes spStep { 0% { transform: rotate(90deg) scale(.4); } 70% { transform: rotate(90deg) scale(1.25); } 100% { transform: rotate(90deg) scale(1); } }
      @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .1s !important; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Ładowanie aplikacji Dogpilot">
      <div class="sp-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="4.5" cy="8.5" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg></div>
      <img class="sp-word" id="sp-word" src="/brand/wordmark.png" alt="dogpilot" />
      <div class="sp-tag" id="sp-tag">Hodowla i psy w jednym miejscu</div>
      <div class="sp-trail" aria-hidden="true"><svg class="sp-paw" viewBox="0 0 24 24"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="4.5" cy="8.5" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg><svg class="sp-paw" viewBox="0 0 24 24"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="4.5" cy="8.5" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg><svg class="sp-paw" viewBox="0 0 24 24"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="4.5" cy="8.5" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg><svg class="sp-paw" viewBox="0 0 24 24"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="4.5" cy="8.5" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg><svg class="sp-paw" viewBox="0 0 24 24"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="4.5" cy="8.5" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg><svg class="sp-paw" viewBox="0 0 24 24"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><circle cx="4.5" cy="8.5" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg></div>
      <div class="sp-pct" id="sp-pct">Ładowanie… 0%</div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        var done = false;
        try { if (sessionStorage.getItem('dogpilot.splash') || /[?&]nosplash/.test(location.search)) { el.remove(); return; } sessionStorage.setItem('dogpilot.splash', '1'); } catch (e) { /* bez pamięci sesji: pokaż intro */ }
        try {
          var st = JSON.parse(localStorage.getItem('dogpilot.state.v1') || 'null');
          var en = (localStorage.getItem('dogpilot.lang') || (st && st.profile && st.profile.language)) === 'en';
          if (st && st.profile && st.profile.darkMode) { el.classList.add('dark'); document.getElementById('sp-word').src = '/brand/wordmark-white.png'; }
          if (en) { document.getElementById('sp-tag').textContent = 'Your kennel and dogs in one place'; }
        } catch (e) { /* brak danych */ }
        var label = en ? 'Loading… ' : 'Ładowanie… ';
        var paws = el.querySelectorAll('.sp-paw'), pct = document.getElementById('sp-pct');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var total = reduce ? 500 : 2600, start = performance.now() + (reduce ? 0 : 900);
        function tick(now) {
          var p = Math.max(0, Math.min(1, (now - start) / (total - (reduce ? 0 : 900))));
          var n = Math.round(p * 100);
          pct.textContent = label + n + '%';
          for (var i = 0; i < paws.length; i++) paws[i].classList.toggle('on', p >= (i + 1) / paws.length - 0.001);
          if (p < 1) requestAnimationFrame(tick); else finish();
        }
        function finish() { if (done) return; done = true; setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 500); }, 250); }
        requestAnimationFrame(tick);
        setTimeout(finish, 6000); // zabezpieczenie
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
